name: Go Tests

on: 
  push:
  schedule:
  - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
      - name: Install dependencies
        run: go mod download
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -race ./...
      - name: Run Gosec Security Scanner
        # gosec v2.29.0's x/tools cannot read Go 1.27.2+ export data ("export
        # data version 5"); pin the toolchain for this step until gosec updates.
        env:
          GOTOOLCHAIN: go1.27.1
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 ./...