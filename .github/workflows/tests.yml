name: Go Tests

on: 
  push:
  schedule:
  - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Install dependencies
        run: go mod download
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -race ./...
      - name: Run Gosec Security Scanner
        # Run with the job's Go toolchain; the gosec Docker action bundles its
        # own Go, which can lag behind the version go.mod requires.
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 ./...